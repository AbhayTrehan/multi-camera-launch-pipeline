################################################################################
# Camera Metadata (Strict Serial Binding)
################################################################################
camera:
  serial_number: "25251937"

################################################################################
# ROS 2 Node Parameters
################################################################################
/**:
  ros__parameters:

    ###########################################################################
    # Camera Identification & Hardware Binding
    ###########################################################################
    serial_number: "25251937"
    frame_id: "25251937"
    parameter_file: "/workspaces/isaac_ros-dev/install/spinnaker_camera_driver/share/spinnaker_camera_driver/config/firefly_ffy_u3162c.yaml"
    ###########################################################################
    # Performance Profile: Mono AprilTag Engine Configuration
    ###########################################################################
    pixel_format: "Mono8"
    
    frame_rate_enable: true
    frame_rate_auto: "Off"
    frame_rate: 40.0
    ###########################################################################
    # Sensor Geometry -- PINNED. Do not rely on power-on defaults.
    #
    # Native-resolution centre crop: binning OFF, 720x540 ROI at (360,270)
    # of the 1440x1080 sensor.  ~45.5 deg horizontal FOV.
    # calibration/25251937.yaml is generated for exactly this geometry.
    #
    # ORDERING MATTERS: binning must be applied BEFORE width/height/offset.
    # With binning 2x2 the sensor is only 720x540, so offset_x=360 is out of
    # range and Spinnaker will clamp or reject it, silently leaving the camera
    # in full-FOV binned mode with a centre-crop calibration.  The apply order
    # comes from `parameter_file`, not from this file -- verify it there.
    ###########################################################################
    binning_selector: "Sensor"
    binning_x: 1
    binning_y: 1

    image_width: 720
    image_height: 540
    offset_x: 360
    offset_y: 270
    exposure_auto: "Off"
    exposure_time: 3000.0
    
    gain_auto: "Off"
    gain: 6.0

    gamma_enable: false
    compute_brightness: false

    ###########################################################################
    # Image Acquisition Triggering
    ###########################################################################
    trigger_mode: "Off"
    trigger_source: "Software"
    trigger_selector: "FrameStart"
    trigger_activation: "RisingEdge"

    ###########################################################################
    # Diagnostics & Buffering
    ###########################################################################
    debug: false
    dump_node_map: false
    adjust_timestamp: true
    buffer_queue_size: 4

    diagnostic_updater.period: 1.0
    min_freq: 38.0
    max_freq: 42.0

    ###########################################################################
    # Quality of Service (QoS)
    ###########################################################################
    image_qos: "SENSOR_DATA"
    camera_info_qos: "SENSOR_DATA"
