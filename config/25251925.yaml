# ############################################################################
# WARNING -- DISABLED CAMERA, GEOMETRY INCONSISTENT WITH THE REST OF THE RIG.
#
# 25251925 is absent from config/robot.yaml and is not launched.
#
# Two things must be fixed before re-enabling it:
#   1. calibration/25251925.yaml is a placeholder, not a real calibration.
#   2. This file still specifies binning 2x2 full-FOV (~80 deg).  The three
#      live cameras are pinned to binning-off 720x540 ROI at (360,270)
#      (~45.5 deg).  Mixing the two gives the fuser cameras whose intrinsics
#      and FOV silently disagree.
#
# Also note `cinfo_url` below is a dead key -- the driver reads
# `camerainfo_url`, which the launch file supplies.
# ############################################################################

################################################################################
# Camera Metadata (Strict Serial Binding)
################################################################################
camera:
  serial_number: "25251925"

################################################################################
# ROS 2 Node Parameters
################################################################################
/**:
  ros__parameters:

    ###########################################################################
    # Camera Identification & Hardware Binding
    ###########################################################################
    serial_number: "25251925"
    frame_id: "25251925"
    cinfo_url: "file:///workspaces/isaac_ros-dev/src/multi_camera_launch/calibration/25251925.yaml"
    parameter_file: "/workspaces/isaac_ros-dev/install/spinnaker_camera_driver/share/spinnaker_camera_driver/config/firefly_ffy_u3162c.yaml"
    ###########################################################################
    # Performance Profile: Mono AprilTag Engine Configuration
    ###########################################################################
    pixel_format: "Mono8"
    
    frame_rate_enable: true
    frame_rate_auto: "Off"
    frame_rate: 40.0
    binning_selector: "Sensor"

    binning_x: 2
    binning_y: 2

    image_width: 720
    image_height: 540

    exposure_auto: "Off"
    exposure_time: 7500.0
    
    gain_auto: "Continuous"
    gain: 0.0

    gamma_enable: false
    compute_brightness: false

    ###########################################################################
    # Image Acquisition Triggering
    ###########################################################################
    trigger_mode: "Off"
    trigger_source: "Software"
    trigger_selector: "FrameStart"
    trigger_activation: "RisingEdge"

    ###########################################################################
    # Diagnostics & Buffering
    ###########################################################################
    debug: false
    dump_node_map: false
    adjust_timestamp: false
    buffer_queue_size: 1

    diagnostic_updater.period: 1.0
    min_freq: 38.0
    max_freq: 42.0

    ###########################################################################
    # Quality of Service (QoS)
    ###########################################################################
    image_qos: "SENSOR_DATA"
    camera_info_qos: "SENSOR_DATA"
